name: insiders-build
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  insiders-build:
    strategy:
      matrix:
        os: [windows-latest, macos-15, ubuntu-latest]
        include:
          # On a GitHub-hosted runner: Ctrl-Q is public, and the organisation's self-hosted runner
          # groups do not admit public repositories, so the win-code-sign runner this leg asked for
          # never started. Not signed: insiders builds are for testing (plabs-house-rules,
          # rules/ci/public-repositories.md), and only a release is signed, in ci.yaml.
          - os: windows-latest
            build: |
              # Inject git SHA and date into package.json
              $GIT_SHA = (git rev-parse --short HEAD)
              $DATE_STR = (Get-Date -Format "yyyy-MMM-dd")
              (Get-Content package.json) -replace '"version": "(.*?)"', ('"version": "$1_' + $DATE_STR + '_' + $GIT_SHA + '"') | Set-Content package.json

              ./node_modules/.bin/esbuild src/ctrl-q.js --bundle --outfile=build.cjs --format=cjs --platform=node --target=node24 --inject:./src/lib/util/import-meta-url.js --define:import.meta.url=import_meta_url
              if ($LASTEXITCODE -ne 0) { throw "esbuild failed with exit code $LASTEXITCODE" }
              node --experimental-sea-config sea-config.json
              if ($LASTEXITCODE -ne 0) { throw "Generating the SEA blob failed with exit code $LASTEXITCODE" }
              node -e "require('fs').copyFileSync(process.execPath, 'ctrl-q.exe')"
              if ($LASTEXITCODE -ne 0) { throw "Copying node.exe failed with exit code $LASTEXITCODE" }

              # Remove node.exe's own signature before postject changes the file. signtool is found
              # by search, as in scripts/release-win.ps1, because the Windows SDK version in its path
              # differs between machines.
              $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
                  Sort-Object FullName -Descending | Select-Object -First 1
              if (-not $signtool) { throw 'signtool.exe not found. Install the signing tools from the Windows SDK.' }
              & $signtool.FullName remove /s "./${env:DIST_FILE_NAME}.exe"
              if ($LASTEXITCODE -ne 0) { throw "signtool remove failed with exit code $LASTEXITCODE" }

              npx postject ctrl-q.exe NODE_SEA_BLOB sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
              if ($LASTEXITCODE -ne 0) { throw "postject failed with exit code $LASTEXITCODE" }

              # Create insider's build zip
              $compress = @{
                Path = "./${env:DIST_FILE_NAME}.exe"
                CompressionLevel = "Fastest"
                DestinationPath = "${env:DIST_FILE_NAME}--win-x64--${{ github.sha }}.zip"
              }

              Compress-Archive @compress

            artifact_insider: ctrl-q--win-x64--${{ github.sha }}.zip
          # On a GitHub-hosted runner: Ctrl-Q is public, and the organisation's self-hosted runner
          # groups do not admit public repositories. Signed ad hoc, which is what lets an arm64 Mac
          # run it at all; not with the Developer ID, and not notarized, because insiders builds are
          # for testing (plabs-house-rules, rules/ci/public-repositories.md). Releases are signed
          # and notarized by scripts/release-macos.sh.
          - os: macos-15
            build: |
              # Inject git SHA and date into package.json
              GIT_SHA=$(git rev-parse --short HEAD)
              DATE_STR=$(date +"%Y-%b-%d")
              VERSION=$(grep -o '"version": "[^"]*"' package.json | cut -d'"' -f4)
              sed -i '' "s/\"version\": \".*\"/\"version\": \"${VERSION}_${DATE_STR}_${GIT_SHA}\"/" package.json

              ./node_modules/.bin/esbuild src/ctrl-q.js --bundle --outfile=build.cjs --format=cjs --platform=node --target=node24 --inject:./src/lib/util/import-meta-url.js --define:import.meta.url=import_meta_url
              node --experimental-sea-config sea-config.json
              cp $(command -v node) ${DIST_FILE_NAME}
              codesign --remove-signature ${DIST_FILE_NAME}
              npx postject ctrl-q NODE_SEA_BLOB sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 --macho-segment-name NODE_SEA

              # Re-sign with an ad-hoc signature, which arm64 macOS requires to run anything
              codesign --sign - "./${DIST_FILE_NAME}"

              # Create insider's build zip
              zip -r "./${DIST_FILE_NAME}--macos-arm64--${{ github.sha }}.zip" "./${DIST_FILE_NAME}" -x "*.DS_Store"

              rm build.cjs

            artifact_insider: ctrl-q--macos-arm64--${{ github.sha }}.zip

          - os: ubuntu-latest
            build: |
              # Inject git SHA and date into package.json
              GIT_SHA=$(git rev-parse --short HEAD)
              DATE_STR=$(date +"%Y-%b-%d")
              VERSION=$(grep -o '"version": "[^"]*"' package.json | cut -d'"' -f4)
              sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}_${DATE_STR}_${GIT_SHA}\"/" package.json

              ./node_modules/.bin/esbuild src/ctrl-q.js --bundle --outfile=build.cjs --format=cjs --platform=node --target=node24 --inject:./src/lib/util/import-meta-url.js --define:import.meta.url=import_meta_url
              node --experimental-sea-config sea-config.json
              cp $(command -v node) ${DIST_FILE_NAME}
              npx postject ctrl-q NODE_SEA_BLOB sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

              chmod +x ${DIST_FILE_NAME}

              # Compress insider's build
              tar -czf "${DIST_FILE_NAME}--linux-x64--${{ github.sha }}.tgz" "${DIST_FILE_NAME}"
              ls -la
            artifact_insider: ctrl-q--linux-x64--${{ github.sha }}.tgz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install tool for creating stand-alone executables
        run: |
          npm install --save-exact esbuild

      - name: Install dependencies
        run: |
          pwd
          npm ci --include=prod

      - name: Run Snyk to check for vulnerabilities
        if: |
          github.repository_owner == 'ptarmiganlabs' &&
          matrix.os == 'ubuntu-latest'
        continue-on-error: true
        uses: snyk/actions/node@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=./package.json --sarif-file-output=snyk.sarif

      - name: Upload Snyk result to GitHub Code Scanning
        if: |
          github.repository_owner == 'ptarmiganlabs' &&
          matrix.os == 'ubuntu-latest'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        with:
          sarif_file: snyk.sarif

      # No leg signs with anything but an ad-hoc signature, so this step needs no secret at all.
      - name: Create binaries
        env:
          DIST_FILE_NAME: ctrl-q
        run: |
          pwd
          ${{ matrix.build }}

      - name: Upload insider build artifacts to GitHub
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact_insider }}
          path: ${{ matrix.artifact_insider }}
