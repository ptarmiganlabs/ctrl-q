# Unit tests (npm test) for every pull request, every push to main, and manual runs.
#
# Ctrl-Q is a public repository, so the job runs on a GitHub-hosted runner, never on the organisation's own runners
# (plabs-house-rules, rules/ci/public-repositories.md). A hosted runner is a fresh virtual machine for every job, so
# pull requests opened from forks run here too. GitHub gives them a read-only token and no secrets, and the tests need
# no more than that.
name: test

on:
    pull_request:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

# A newer commit on a pull request cancels the run for the older one. Every other event gets a group of its own, so a
# run on main is never cancelled (plabs-house-rules, rules/ci/workflows.md).
concurrency:
    group: test-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
    cancel-in-progress: true

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    unit-tests:
        runs-on: ubuntu-latest
        # A hung job must not run for GitHub's 6 h default.
        timeout-minutes: 15
        steps:
            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  # npm ci runs install scripts, so the token must not be left in .git/config. Nothing here pushes.
                  persist-credentials: false

            - name: Install Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: .nvmrc
                  # The newest release of that line, not whichever one the runner image has cached
                  check-latest: true

            - name: Install dependencies
              run: npm ci --no-audit --no-fund

            - name: Run unit tests
              run: npm test
