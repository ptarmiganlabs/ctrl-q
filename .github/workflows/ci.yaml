name: ci

on:
    workflow_dispatch:
        inputs:
            # Builds the dispatched commit for macOS and Windows and signs both, notarizing the macOS
            # one, then stops: nothing is released, and the signed builds are kept as workflow
            # artifacts for three days. The only way to prove the signing on macos-15 and through
            # Azure Artifact Signing before a release depends on it. Dispatch it on main; the
            # release-signing environment admits no other branch:
            #
            #   gh workflow run ci.yaml --ref main -f rehearse_signing=true
            rehearse_signing:
                description: Build and sign the macOS and Windows binaries, and release nothing
                type: boolean
                default: false
    push:
        branches:
            - main

jobs:
    release-please:
        runs-on: ubuntu-latest
        outputs:
            releases_created: ${{ steps.release.outputs.releases_created }}
            release_tag_name: ${{ steps.release.outputs['tag_name'] }}
            release_version: ${{ steps.release.outputs['version'] }}
            release_upload_url: ${{ steps.release.outputs['upload_url'] }}
            # The commit release-please released. Not necessarily the commit that started this run:
            # release-please releases main's HEAD, a different commit whenever another push started it.
            release_sha: ${{ steps.release.outputs['sha'] }}
        env:
            GITHUB_REF: ${{ github.ref }}
            GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_PAT }}
            DIST_FILE_NAME: ctrl-q
        permissions:
            contents: write
            pull-requests: write
        steps:
            - name: Show github.ref
              run: echo "$GITHUB_REF"

            - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
              id: release
              if: |
                  github.repository_owner == 'ptarmiganlabs'
              with:
                  token: ${{ secrets.RELEASE_PLEASE_PAT }}
                  # optional. customize path to release-please-config.json
                  config-file: release-please-config.json
                  # optional. customize path to .release-please-manifest.json
                  manifest-file: .release-please-manifest.json
                  target-branch: main

            - name: Show output from Release-Please
              if: always()
              env:
                  RELEASE_PLEASE_OUTPUT: ${{ toJSON(steps.release.outputs) }}
              run: echo "$RELEASE_PLEASE_OUTPUT"

            - name: Show output from Release-Please
              run: |
                  echo "releases_created: ${{ steps.release.outputs.releases_created }}"
                  echo "release_created : ${{ steps.release.outputs.release_created }}"
                  echo "draft           : ${{ steps.release.outputs['draft'] }}"
                  echo "path            : ${{ steps.release.outputs['path'] }}"
                  echo "upload_url      : ${{ steps.release.outputs['upload_url'] }}"
                  echo "html_url        : ${{ steps.release.outputs['html_url'] }}"
                  echo "tag_name        : ${{ steps.release.outputs['tag_name'] }}"
                  echo "version         : ${{ steps.release.outputs['version'] }}"
                  echo "major           : ${{ steps.release.outputs['major'] }}"
                  echo "minor           : ${{ steps.release.outputs['minor'] }}"
                  echo "patch           : ${{ steps.release.outputs['patch'] }}"
                  echo "sha             : ${{ steps.release.outputs['sha'] }}"

    #####################
    # On a GitHub-hosted runner: Ctrl-Q is public, and the organisation's self-hosted runner groups
    # do not admit public repositories, so a job asking for the build Mac never starts
    # (plabs-house-rules, rules/ci/public-repositories.md). Each run gets a fresh VM, so nothing the
    # signing leaves behind outlives the job.
    release-macos:
        needs: release-please
        runs-on: macos-15
        # For its deployment policy, which admits main and nothing else, so that only merged code
        # signs with the production identity. The Apple secrets are organisation secrets, which an
        # environment does not scope.
        environment: release-signing
        timeout-minutes: 30
        permissions:
            contents: write

        if: >-
            needs.release-please.outputs.releases_created == 'true'
            || (github.event_name == 'workflow_dispatch' && inputs.rehearse_signing)
        env:
            DIST_FILE_NAME: ctrl-q
            GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_PAT }}
        # The Apple secrets are on the step that signs, not on the job. As job env they reached
        # every step here: setup-node, npm install, npm ci with its dependencies' install scripts,
        # and the third-party action that attaches the zip. scripts/test/release-kit.test.js holds
        # them to that one step.
        steps:
            - name: Release tag and upload url from previous job
              run: |
                  echo "tag_name   : ${{ needs.release-please.outputs.release_tag_name }}"
                  echo "version    : ${{ needs.release-please.outputs.release_version }}"
                  echo "upload_url : ${{ needs.release-please.outputs.release_upload_url }}"

            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24

            - name: Install tool for creating stand-alone executables
              run: |
                  npm install --save-exact esbuild

            - name: Install dependencies
              run: |
                  pwd
                  npm ci --include=prod

            # A release's zip is named for its version. A rehearsal has none, so its zip is named for
            # the commit, and cannot be mistaken for a release's.
            - name: Name the build
              id: name
              env:
                  RELEASE_VERSION: ${{ needs.release-please.outputs.release_version }}
              run: |
                  if [ -n "$RELEASE_VERSION" ]; then version="$RELEASE_VERSION"; else version="rehearsal-${GITHUB_SHA:0:7}"; fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  echo "building $version"

            - name: Build, sign and notarize
              env:
                  RELEASE_VERSION: ${{ steps.name.outputs.version }}
                  MACOS_CERTIFICATE: ${{ secrets.PROD_MACOS_CERTIFICATE_BASE64_CODESIGN }}
                  MACOS_CERTIFICATE_PWD: ${{ secrets.PROD_MACOS_CERTIFICATE_CODESIGN_PWD }}
                  MACOS_CERTIFICATE_NAME: ${{ secrets.PROD_MACOS_CERTIFICATE_CODESIGN_NAME }}
                  PROD_MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_APPLE_ID }}
                  PROD_MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.PROD_MACOS_NOTARIZATION_TEAM_ID }}
                  PROD_MACOS_NOTARIZATION_PWD: ${{ secrets.PROD_MACOS_NOTARIZATION_PWD }}
              run: bash ./scripts/release-macos.sh

            - name: Upload to existing release
              if: needs.release-please.outputs.releases_created == 'true'
              uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
              with:
                  allowUpdates: true
                  omitBodyDuringUpdate: true
                  omitNameDuringUpdate: true
                  artifactContentType: raw
                  # artifactContentType: application/zip
                  draft: true
                  tag: ${{ needs.release-please.outputs.release_tag_name }}
                  artifacts: ./ctrl-q-${{ needs.release-please.outputs.release_version }}-macos.zip
                  token: ${{ github.token }}

            - name: Keep the rehearsal's zip
              if: needs.release-please.outputs.releases_created != 'true'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: ctrl-q-${{ steps.name.outputs.version }}-macos
                  path: ./ctrl-q-${{ steps.name.outputs.version }}-macos.zip
                  retention-days: 3
                  if-no-files-found: error

    #####################
    # Windows, in three jobs, so that no job both runs repository code and holds the signing
    # credential (plabs-house-rules, rules/ci/public-repositories.md). Butler SOS and Butler sign
    # the same way:
    #
    #   build-win64    repository code and npm, no credential   -> unsigned ctrl-q.exe
    #   sign-win64     the Azure credential, no repository code -> signed ctrl-q.exe
    #   publish-win64  neither                                  -> zip attached to the release
    #
    # All three run on GitHub-hosted runners: Ctrl-Q is public, and the organisation's self-hosted
    # runner groups do not admit public repositories, so the win-code-sign runner this used to ask
    # for never started. No certificate is stored anywhere: sign-win64 signs through Azure,
    # authenticated by GitHub's OIDC token.
    #
    # A rehearsal (rehearse_signing, above) builds the dispatched commit, signs it, verifies the
    # signature and stops. publish-win64 never runs in one, and the signed binary is kept as a
    # workflow artifact for three days.
    build-win64:
        needs: release-please
        # As release-macos: a release, or a rehearsal. release-please runs in a rehearsal too,
        # so the implicit success() holds in both.
        if: >-
            needs.release-please.outputs.releases_created == 'true'
            || (github.event_name == 'workflow_dispatch' && inputs.rehearse_signing)
        runs-on: windows-latest
        timeout-minutes: 30
        permissions:
            contents: read # checkout only
        steps:
            # A release builds the released commit, never github.sha. A rehearsal has no release, so it
            # builds the commit it was started on.
            - name: Checkout the commit being built
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  ref: ${{ needs.release-please.outputs.releases_created == 'true' && needs.release-please.outputs.release_sha || github.sha }}
                  persist-credentials: false

            # No npm cache: what this job builds gets signed, so it starts from nothing an earlier run
            # left behind.
            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24

            - name: Verify the checkout is the version being released
              if: needs.release-please.outputs.releases_created == 'true'
              shell: pwsh
              env:
                  RELEASE_VERSION: ${{ needs.release-please.outputs.release_version }}
              run: |
                  $actual = node -p "require('./package.json').version"
                  Write-Host "release-please : $env:RELEASE_VERSION"
                  Write-Host "package.json   : $actual"
                  if ($actual -ne $env:RELEASE_VERSION) {
                    throw "Refusing to build: package.json says $actual, but the release is $env:RELEASE_VERSION."
                  }

            # --ignore-scripts: no dependency's install script runs where the binary that gets signed
            # is built.
            - name: Install dependencies
              run: npm ci --ignore-scripts

            # scripts/release-win.ps1 builds, smoke-tests and checks the binary carries no signature,
            # and records the digest sign-win64 checks against. release-kit.yaml runs the same script
            # on pull requests.
            - name: Build the unsigned binary
              shell: pwsh
              run: |
                  ./scripts/release-win.ps1
                  $hash = Get-Content -LiteralPath ./ctrl-q.exe.sha256
                  Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "Unsigned Windows binary SHA256: ``$hash``"

            # 30 days for a release, which is as long as GitHub lets a job be re-run. A failed
            # sign-win64 or publish-win64 can only be recovered with "Re-run failed jobs", and that needs
            # this artifact still to exist: "Re-run all jobs" builds nothing, because release-please
            # then finds the release already made and reports no new one. The repository's own
            # artifact retention caps this, at 7 days on 2026-10-18, so that is the time there is to
            # re-run a failed job. A rehearsal needs three days.
            - name: Upload the unsigned binary
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: win64-unsigned
                  path: |
                      ctrl-q.exe
                      ctrl-q.exe.sha256
                  retention-days: ${{ inputs.rehearse_signing && 3 || 30 }}
                  if-no-files-found: error

    sign-win64:
        needs: build-win64
        # Explicit, because the implicit success() fails when anything further up the chain was
        # skipped, and this job depends on build-win64 alone.
        if: ${{ !cancelled() && needs.build-win64.result == 'success' }}
        # INVARIANT: no actions/checkout, no npm and no ./scripts in this job
        # (scripts/test/release-kit.test.js holds it). A compromised dependency must not be able to
        # reach the Azure OIDC token. A step that needs repository content belongs in build-win64 or
        # publish-win64.
        runs-on: windows-latest
        timeout-minutes: 15
        # This is what binds the OIDC token's subject, and the signing app's federated credential in
        # Entra must match the subject exactly. With GitHub's immutable subject switched on for the
        # repository, as in every Ptarmigan Labs repository that signs through Azure, it is:
        #
        #   repo:ptarmiganlabs@6304190/ctrl-q@375401683:environment:release-signing
        #
        # Renaming this environment or the repository, or transferring the repository, breaks signing
        # with AADSTS700213, "no matching federated identity record found". Regenerate the prefix rather
        # than retyping it, then append ":environment:release-signing":
        #
        #   gh api repos/ptarmiganlabs/ctrl-q/actions/oidc/customization/sub --jq .sub_claim_prefix
        environment: release-signing
        permissions:
            id-token: write # the OIDC token azure/login exchanges for the signing credential
            contents: read # nothing is checked out; downloading this run's artifact needs no more
        outputs:
            # The SHA-256 of the binary the verify step found signed by Ptarmigan Labs AB.
            # publish-win64 checks the binary in the zip it attaches against this. A job's outputs are
            # fixed when it ends, so nothing after this job can change it.
            signed_sha256: ${{ steps.verify.outputs.sha256 }}
        steps:
            - name: Download the unsigned binary
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: win64-unsigned
                  path: to-sign

            # GitHub already protects artifacts, so this cannot currently fail. It states what the job
            # assumes, and would catch a later change that rebuilds or re-uploads between build and sign.
            - name: Verify the artifact is what build-win64 produced
              shell: pwsh
              run: |
                  $expected = (Get-Content to-sign/ctrl-q.exe.sha256 -Raw).Trim()
                  $actual = (Get-FileHash to-sign/ctrl-q.exe -Algorithm SHA256).Hash
                  Write-Host "built  : $expected"
                  Write-Host "to sign: $actual"
                  if ($actual -ne $expected) {
                    throw "Refusing to sign: the artifact does not match the digest build-win64 recorded."
                  }
                  Remove-Item to-sign/ctrl-q.exe.sha256

            - name: Azure login via OIDC
              uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
              with:
                  client-id: ${{ vars.AZURE_CLIENT_ID }}
                  tenant-id: ${{ vars.AZURE_TENANT_ID }}
                  subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

            - name: Sign with Azure Artifact Signing
              uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
              with:
                  endpoint: ${{ vars.SIGNING_ENDPOINT }}
                  signing-account-name: ${{ vars.SIGNING_ACCOUNT_NAME }}
                  certificate-profile-name: ${{ vars.SIGNING_CERT_PROFILE_NAME }}
                  files-folder: ${{ github.workspace }}\to-sign
                  files-folder-filter: exe
                  file-digest: SHA256
                  timestamp-rfc3161: http://timestamp.acs.microsoft.com
                  timestamp-digest: SHA256

            # A hard failure, deliberately: if signing fails, the release fails, rather than quietly
            # shipping something unsigned. Two readings of the same signature (signtool's chain and
            # timestamp check, and the one Windows itself makes), plus a check that the signer is
            # Ptarmigan Labs AB, so that a misconfigured certificate profile cannot sign as anyone else.
            # The binary's hash, taken once all of that has held, becomes the job's output.
            - name: Verify the signature
              id: verify
              shell: pwsh
              run: |
                  $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
                        Sort-Object FullName -Descending | Select-Object -First 1
                  if (-not $st) { throw "signtool.exe not found on this runner." }
                  & $st.FullName verify /pa /v to-sign\ctrl-q.exe
                  if ($LASTEXITCODE -ne 0) { throw "Signature verification failed." }
                  $sig = Get-AuthenticodeSignature -LiteralPath to-sign\ctrl-q.exe
                  if ($sig.Status -ne 'Valid') { throw "Windows reads the signature as $($sig.Status): $($sig.StatusMessage)" }
                  # The certificate's own parsed common name, compared exactly and case-sensitively. Not a
                  # pattern over the subject string, which "Ptarmigan Labs ABC", "Ptarmigan Labs AB
                  # Holding" or quoting in the distinguished name could get past.
                  $signer = $sig.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
                  if ($signer -cne 'Ptarmigan Labs AB') {
                    throw "Signed by an unexpected certificate: '$signer' ($($sig.SignerCertificate.Subject))"
                  }
                  $hash = (Get-FileHash -LiteralPath to-sign\ctrl-q.exe -Algorithm SHA256).Hash
                  Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "sha256=$hash"
                  Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @(
                    "Signed by: ``$($sig.SignerCertificate.Subject)``",
                    "Timestamped by: ``$($sig.TimeStamperCertificate.Subject)``",
                    "Signed Windows binary SHA256: ``$hash``"
                  )

            - name: Upload the signed binary
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: win64-signed
                  path: to-sign/ctrl-q.exe
                  # 30 days for a release, so that a failed publish-win64 can still be re-run on its own;
                  # see the uploads in build-win64. A rehearsal's binary stays three days, for anyone who
                  # wants to try it on a real machine.
                  retention-days: ${{ inputs.rehearse_signing && 3 || 30 }}
                  if-no-files-found: error

    publish-win64:
        needs: [release-please, build-win64, sign-win64]
        # Never on a rehearsal, which has no release to attach to.
        if: >-
            !cancelled()
            && needs.release-please.outputs.releases_created == 'true'
            && needs.sign-win64.result == 'success'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write # attaches the zip to the release
            id-token: write # for the provenance attestation only
            attestations: write # stores the provenance attestation
        steps:
            - name: Download the signed binary
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: win64-signed
                  path: package

            # Lets anyone check, with `gh attestation verify`, that a given copy of the signed binary came
            # out of this workflow at this commit. Available because the repository is public.
            #
            # Only when this run's commit is the released commit. The attestation takes its source commit
            # from the run's OIDC token, which is github.sha, while build-win64 built release_sha. The two
            # differ when a later push's run is the one that creates the release, and an attestation that
            # names the wrong source commit is worse than none.
            - name: Generate build provenance
              if: needs.release-please.outputs.release_sha == github.sha
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-path: package/ctrl-q.exe

            - name: Say why there is no build provenance
              if: needs.release-please.outputs.release_sha != github.sha
              env:
                  RELEASE_SHA: ${{ needs.release-please.outputs.release_sha }}
                  RUN_SHA: ${{ github.sha }}
              run: |
                  echo "::warning::No build provenance attestation for the Windows binary: this run started at $RUN_SHA, but the release and its binary are from $RELEASE_SHA, and the attestation would name the wrong commit."

            # The signed executable alone, as the release zip has always held it. And the ctrl-q.exe in
            # the zip is the one sign-win64 found signed, byte for byte, read back out of the finished
            # zip, so that nothing that replaced package/ctrl-q.exe after the download is attached in
            # its place. Nothing runs between this step and the attach.
            - name: Zip it
              env:
                  ZIP_NAME: ctrl-q-${{ needs.release-please.outputs.release_version }}-win.zip
                  SIGNED_SHA256: ${{ needs.sign-win64.outputs.signed_sha256 }}
              run: |
                  set -euo pipefail
                  if [ -z "$SIGNED_SHA256" ]; then echo "::error::sign-win64 recorded no hash of the binary it verified. Refusing to publish."; exit 1; fi
                  cd package
                  test -f ctrl-q.exe || { echo "::error::ctrl-q.exe is missing from what sign-win64 produced"; exit 1; }
                  zip -9 "../$ZIP_NAME" ctrl-q.exe
                  cd ..
                  unzip -l "$ZIP_NAME"
                  signed=$(printf '%s' "$SIGNED_SHA256" | tr 'A-F' 'a-f')
                  zipped=$(unzip -p "$ZIP_NAME" ctrl-q.exe | sha256sum | cut -d' ' -f1)
                  if [ "$zipped" != "$signed" ]; then
                    echo "::error::The ctrl-q.exe in $ZIP_NAME is not the binary sign-win64 verified ($SIGNED_SHA256 signed, $zipped zipped). Refusing to publish."
                    exit 1
                  fi
                  echo "The ctrl-q.exe in $ZIP_NAME is the one sign-win64 verified: $zipped"

            - name: Attach to the release
              uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
              with:
                  allowUpdates: true
                  omitBodyDuringUpdate: true
                  omitNameDuringUpdate: true
                  # The release exists already, as a draft, so this is an update and its draft state is
                  # left alone: a re-run after the release is published cannot turn it back into a draft.
                  # draft: true still applies should the release somehow not exist.
                  draft: true
                  omitDraftDuringUpdate: true
                  artifactContentType: raw
                  tag: ${{ needs.release-please.outputs.release_tag_name }}
                  artifacts: ./ctrl-q-${{ needs.release-please.outputs.release_version }}-win.zip
                  token: ${{ github.token }}

    #####################
    release-linux:
        needs: release-please
        runs-on: ubuntu-latest
        # timeout-minutes: 15

        if: needs.release-please.outputs.releases_created == 'true'
        env:
            DIST_FILE_NAME: ctrl-q
            GITHUB_TOKEN: ${{ secrets.RELEASE_PLEASE_PAT }}
        steps:
            - name: Release tag and upload url from previous job
              run: |
                  echo "tag_name   : ${{ needs.release-please.outputs.release_tag_name }}"
                  echo "version    : ${{ needs.release-please.outputs.release_version }}"
                  echo "upload_url : ${{ needs.release-please.outputs.release_upload_url }}"

            - name: Checkout repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Setup Node.js
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version: 24

            - name: Install tool for creating stand-alone executables
              run: |
                  npm install --save-exact esbuild

            - name: Install dependencies
              run: |
                  pwd
                  npm ci

            - name: Build binaries
              run: |
                  ./node_modules/.bin/esbuild src/ctrl-q.js --bundle --outfile=build.cjs --format=cjs --platform=node --target=node24 --inject:./src/lib/util/import-meta-url.js --define:import.meta.url=import_meta_url
                  node --experimental-sea-config sea-config.json
                  cp $(command -v node) ${DIST_FILE_NAME}
                  npx postject ctrl-q NODE_SEA_BLOB sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

                  chmod +x ${DIST_FILE_NAME}

            - name: Make binary executable
              run: |
                  chmod +x ./${DIST_FILE_NAME}

            - name: Compress release binary
              run: |
                  ls -la
                  zip -9 -r ./${DIST_FILE_NAME}-${{ needs.release-please.outputs.release_version }}-linux.zip ${DIST_FILE_NAME}

            - name: Debug
              run: |
                  ls -la

            - name: Upload to existing release
              uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
              with:
                  allowUpdates: true
                  omitBodyDuringUpdate: true
                  omitNameDuringUpdate: true
                  artifactContentType: raw
                  # artifactContentType: application/zip
                  draft: true
                  tag: ${{ needs.release-please.outputs.release_tag_name }}
                  artifacts: ./ctrl-q-${{ needs.release-please.outputs.release_version }}-linux.zip
                  token: ${{ github.token }}

            - name: Tidy up before existing
              run: |
                  pwd
                  ls -la
                  rm build.cjs
                  rm "./${DIST_FILE_NAME}"
                  rm "./${DIST_FILE_NAME}-${{ needs.release-please.outputs.release_version }}-linux.zip"
